# Builds the wheels of an oxidian release tag, attaches them to a GitHub release and publishes a
# flat package index of every release's wheels on GitHub Pages. Nothing here publishes to PyPI.
name: release

on:
  push:
    tags:
      - "v*-oxidian.*"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Check the tag names the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$TAG" != "v${version/+/-}" ]; then
            echo "::error::tag $TAG does not name Cargo.toml's version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: build linux ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --features pyo3/abi3-py311 --out dist -i 3.11
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: build macos universal2
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the stable Rust toolchain for both macOS architectures
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --features pyo3/abi3-py311 --target universal2-apple-darwin --out dist -i 3.11
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-universal2
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: test ${{ matrix.wheels }} on ${{ matrix.runner }} ${{ matrix.architecture }} python ${{ matrix.python }}
    needs: [linux, macos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        wheels: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
        include:
          - wheels: linux-x86_64
            artifact: wheels-linux-x86_64
            runner: ubuntu-latest
            architecture: x64
          - wheels: linux-aarch64
            artifact: wheels-linux-aarch64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - wheels: macos-arm64
            artifact: wheels-macos-universal2
            runner: macos-latest
            architecture: arm64
          - wheels: macos-x86_64
            artifact: wheels-macos-universal2
            runner: macos-latest
            architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the wheel
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group test
          python -m pip install pycrdt --no-deps --no-index --find-links dist
      - name: Test the installed wheel
        run: python -m pytest --ignore tests/test_types.py

  audit:
    name: audit stable-ABI wheels
    needs: [linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Audit every CPython stable-ABI wheel
        run: |
          python -m pip install abi3audit
          abi3audit --strict dist/*-cp311-abi3-*.whl

  release:
    name: attach wheels to the GitHub release
    needs: [version, test, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum -- *.whl > SHA256SUMS)
          yrs=$(grep -o 'git+https://github.com/oxidian/y-crdt[^"]*' Cargo.lock)
          {
            echo "pycrdt $VERSION: upstream pycrdt built against the patched yrs at \`$yrs\`."
            echo
            echo "Install from the flat package index at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ (uv: \`format = \"flat\"\`). These wheels are never published to PyPI."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "pycrdt $VERSION" --notes-file notes.md dist/*.whl dist/SHA256SUMS

  pages:
    name: publish the flat package index
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the index of every release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/flat_index.py "$GITHUB_REPOSITORY" site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
